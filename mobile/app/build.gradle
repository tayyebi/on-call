apply plugin: 'com.android.application'

android {
    namespace 'com.tayyebi.oncall'
    compileSdk 34

    defaultConfig {
        applicationId "com.tayyebi.oncall"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

// Only the AndroidX core compat library (for notifications/permissions APIs
// on older SDKs); no HTTP/JSON/DI third-party libs — plain HttpURLConnection
// and org.json, matching the "no maven / no marline / no dart" constraint.
dependencies {
    implementation 'androidx.core:core:1.13.1'
}
