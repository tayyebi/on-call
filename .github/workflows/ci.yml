name: ci

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  server-build:
    name: Merge server into one PHP file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Merge src/ and public/ into dist/app.php
        working-directory: server
        run: php build.php
      - name: Test merged build
        working-directory: server
        run: php tests/build_test.php
      - name: Test device lifecycle
        working-directory: server
        run: php tests/device_lifecycle_test.php
      - name: Attach server files to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" server/dist/app.php server/dist/style.css server/dist/opendocs.json --clobber

  mobile-build:
    name: Build Android APK
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install platform and build-tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Build release APK
        working-directory: mobile
        run: ./build.sh
      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" mobile/build/outputs/apk/release/*.apk --clobber
